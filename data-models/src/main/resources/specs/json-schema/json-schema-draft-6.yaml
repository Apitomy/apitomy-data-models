name: JSON Schema Draft 6
version: draft-6
versions:
  - version: draft-6
    url: https://tools.ietf.org/html/draft-wright-json-schema-validation-01
prefix: JD6
namespace: io.apitomy.datamodels.models.jsonschema.draft.draft6
majorVersionPrefix: JD
majorVersionNamespace: io.apitomy.datamodels.models.jsonschema.draft
conversionTarget: compound

traits:
  - name: Referenceable
    properties:
      - name: '$ref'
        type: string

typeAliases:
  - name: JsonSchema
    type: boolean|FullSchema
  - name: Dependency
    type: FullSchema|[string]

root:
  type: JsonSchema

entities:
  - name: FullSchema
    traits:
      - Referenceable
    properties:
      - name: '$id'
        type: string
      - name: '$schema'
        type: string
      - name: title
        type: string
      - name: description
        type: string
      - name: default
        type: any
      - name: examples
        type: '[any]'
      - name: definitions
        type: '{JsonSchema}'
      - name: type
        type: 'string|[string]'
      - name: enum
        type: '[any]'
      - name: const
        type: any
      - name: format
        type: string
      - name: allOf
        type: '[JsonSchema]'
      - name: anyOf
        type: '[JsonSchema]'
      - name: oneOf
        type: '[JsonSchema]'
      - name: not
        type: JsonSchema
      - name: multipleOf
        type: number
      - name: minimum
        type: number
      - name: maximum
        type: number
      - name: exclusiveMinimum
        type: number
      - name: exclusiveMaximum
        type: number
      - name: minLength
        type: integer
      - name: maxLength
        type: integer
      - name: pattern
        type: string
      - name: items
        type: 'boolean|FullSchema|[FullSchema]'
      - name: additionalItems
        type: JsonSchema
      - name: minItems
        type: integer
      - name: maxItems
        type: integer
      - name: uniqueItems
        type: boolean
      - name: contains
        type: JsonSchema
      - name: properties
        type: '{JsonSchema}'
      - name: patternProperties
        type: '{JsonSchema}'
      - name: additionalProperties
        type: JsonSchema
      - name: required
        type: '[string]'
      - name: minProperties
        type: integer
      - name: maxProperties
        type: integer
      - name: dependencies
        type: '{Dependency}'
      - name: propertyNames
        type: JsonSchema
    propertyOrder:
      - $Referenceable
      - $this
