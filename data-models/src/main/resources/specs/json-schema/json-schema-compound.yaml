name: JSON Schema Compound
version: compound
versions:
  - version: compound
    url: https://json-schema.org/
prefix: JC
namespace: io.apitomy.datamodels.models.jsonschema.compound
majorVersionPrefix: JC
majorVersionNamespace: io.apitomy.datamodels.models.jsonschema.compound

# Synthetic compound schema merging all properties from all JSON Schema drafts
# (draft-4, draft-6, draft-7, 2019-09, 2020-12) into a single entity.
# Used for cross-version compatibility checking — converters map each draft
# version to this compound type, then the diff visitor compares compound-to-compound.

traits:
  - name: Referenceable
    properties:
      - name: '$ref'
        type: string

typeAliases:
  - name: JsonSchema
    type: boolean|FullSchema
  - name: Dependency
    type: FullSchema|[string]

root:
  type: JsonSchema

entities:
  - name: RangeValue
    properties:
      - name: value
        type: number
      - name: exclusive
        type: boolean
    propertyOrder:
      - $this

  - name: FullSchema
    traits:
      - Referenceable
    properties:
      # --- Identification (superset of id, $id, $anchor, $schema, $comment) ---
      - name: id
        type: string
        # d4 only; renamed to $id in d6+
      - name: '$id'
        type: string
        # d6+
      - name: '$schema'
        type: string
      - name: '$anchor'
        type: string
        # 2019-09+
      - name: '$comment'
        type: string
        # d7+

      # --- Dynamic references (2019-09, 2020-12) ---
      - name: '$recursiveRef'
        type: string
        # 2019-09 only
      - name: '$recursiveAnchor'
        type: boolean
        # 2019-09 only
      - name: '$dynamicRef'
        type: string
        # 2020-12 only
      - name: '$dynamicAnchor'
        type: string
        # 2020-12 only

      # --- Metadata ---
      - name: title
        type: string
      - name: description
        type: string
      - name: default
        type: any
      - name: examples
        type: '[any]'
        # d6+
      - name: readOnly
        type: boolean
        # d7+
      - name: writeOnly
        type: boolean
        # d7+
      - name: deprecated
        type: boolean
        # 2019-09+

      # --- Definitions (superset of definitions, $defs) ---
      - name: definitions
        type: '{JsonSchema}'
        # d4-d7
      - name: '$defs'
        type: '{JsonSchema}'
        # 2019-09+

      # --- Type & enum ---
      - name: type
        type: 'string|[string]'
      - name: enum
        type: '[any]'
      - name: const
        type: any
        # d6+
      - name: format
        type: string

      # --- Composition ---
      - name: allOf
        type: '[JsonSchema]'
      - name: anyOf
        type: '[JsonSchema]'
      - name: oneOf
        type: '[JsonSchema]'
      - name: not
        type: JsonSchema

      # --- Conditionals (d7+) ---
      - name: if
        type: JsonSchema
      - name: then
        type: JsonSchema
      - name: else
        type: JsonSchema

      # --- Numeric validation ---
      - name: multipleOf
        type: number
      # minimum/maximum normalized to RangeValue during conversion.
      # Combines value + exclusivity into a single field.
      # d4's boolean exclusiveMinimum + minimum → single RangeValue.
      # d6+ minimum/exclusiveMinimum → tighter bound as RangeValue.
      - name: minimum
        type: RangeValue
      - name: maximum
        type: RangeValue

      # --- String validation ---
      - name: minLength
        type: integer
      - name: maxLength
        type: integer
      - name: pattern
        type: string
      - name: contentMediaType
        type: string
        # d7+
      - name: contentEncoding
        type: string
        # d7+
      - name: contentSchema
        type: JsonSchema
        # 2019-09+

      # --- Array validation ---
      # items uses the widest type (union of all forms across drafts)
      - name: items
        type: 'boolean|FullSchema|[FullSchema]'
      - name: additionalItems
        type: JsonSchema
        # d4-2019-09
      - name: prefixItems
        type: '[JsonSchema]'
        # 2020-12 only
      - name: minItems
        type: integer
      - name: maxItems
        type: integer
      - name: uniqueItems
        type: boolean
      - name: contains
        type: JsonSchema
        # d6+
      - name: minContains
        type: integer
        # 2020-12 only
      - name: maxContains
        type: integer
        # 2020-12 only
      - name: unevaluatedItems
        type: JsonSchema
        # 2020-12 only

      # --- Object validation ---
      - name: properties
        type: '{JsonSchema}'
      - name: patternProperties
        type: '{JsonSchema}'
      - name: additionalProperties
        type: JsonSchema
      - name: required
        type: '[string]'
      - name: minProperties
        type: integer
      - name: maxProperties
        type: integer
      - name: dependencies
        type: '{Dependency}'
        # d4-d7
      - name: dependentSchemas
        type: '{JsonSchema}'
        # 2019-09+
      - name: dependentRequired
        type: '{any}'
        # 2019-09+
      - name: propertyNames
        type: JsonSchema
        # d6+
      - name: unevaluatedProperties
        type: JsonSchema
        # 2020-12 only

    propertyOrder:
      - $Referenceable
      - $this
