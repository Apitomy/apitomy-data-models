name: First Spec API 2.0
version: 2.0
versions:
  - version: 2.0
    url: https://example.com/FirstSpec/versions/2.0.md
prefix: Frst20
namespace: org.example.multil.frst.v2x.v20
majorVersionPrefix: Frst2x
majorVersionNamespace: org.example.multil.frst.v2x

traits:
  - name: Named
    properties:
      - name: name
        type: string
  - name: Described
    properties:
      - name: description
        type: string
      - name: summary
        type: string

root:
  type: Document

entities:
  - name: Document
    traits:
      - Named
      - Described
    properties:
      - name: spec
        type: string
      - name: version
        type: string
      - name: id
        type: string
      - name: widgets
        type: '[Widget]'
      - name: servers
        type: '[Server]'
      - name: tags
        type: '[Tag]'
      - name: properties
        type: Properties
    propertyOrder:
      - $Named
      - $Described
      - $this

  - name: Widget
    traits:
      - Named
    properties:
      - name: widgetId
        type: string
      - name: size
        type: string
    propertyOrder:
      - $Named
      - $this

  - name: Server
    traits:
      - Named
    properties:
      - name: url
        type: string
    propertyOrder:
      - $Named
      - $this

  - name: Tag
    traits:
      - Named
      - Described
    properties:
      - name: value
        type: string
      - name: documentation
        type: string
    propertyOrder:
      - $Named
      - $Described
      - $this

  - name: Properties
    properties:
      - name: '*'
        type: string
    propertyOrder:
      - $this

