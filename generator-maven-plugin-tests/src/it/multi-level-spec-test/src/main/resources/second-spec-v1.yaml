name: Second Spec API 1.0
version: 1.0
versions:
  - version: 1.0
    url: https://example.com/SecondSpec/versions/1.0.md
prefix: Scnd10
namespace: org.example.multil.scnd.v1x.v10
majorVersionPrefix: Scnd1x
majorVersionNamespace: org.example.multil.scnd.v1x

traits:
  - name: Named
    properties:
      - name: name
        type: string
  - name: Described
    properties:
      - name: description
        type: string

root:
  type: Document

entities:
  - name: Document
    traits:
      - Named
      - Described
    properties:
      - name: spec
        type: string
      - name: version
        type: string
      - name: id
        type: string
      - name: widgets
        type: '[Widget]'
      - name: tags
        type: '[Tag]'
      - name: mice
        type: '[Mouse]'
    propertyOrder:
      - $Named
      - $Described
      - $this

  - name: Widget
    traits:
      - Named
    properties:
      - name: type
        type: string
    propertyOrder:
      - $Named
      - $this

  - name: Tag
    traits:
      - Named
      - Described
    properties:
      - name: value
        type: string
    propertyOrder:
      - $Named
      - $Described
      - $this

  - name: Mouse
    properties:
      - name: type
        type: string
      - name: length
        type: integer
    propertyOrder:
      - $this

