name: Maven Publish Workflow
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 2.3.0)'
        required: true
      branch:
        description: 'Branch/tag to publish from'
        required: true
        default: 'main'
  workflow_call:
    inputs:
      release-version:
        description: 'Release version to publish'
        required: true
        type: string
      branch:
        description: 'Branch/tag to publish from'
        required: true
        type: string
      quiet:
        description: 'Leave the Slack notification to the caller'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  maven-publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    if: github.repository_owner == 'Apitomy'
    steps:

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Data Models version ${{ inputs.release-version }} to Maven Central"
          echo "Publishing from branch/tag: ${{ inputs.branch }}"


      - name: Set up settings.xml
        run: |
          echo "<settings><servers><server><id>central</id><username>${{ secrets.CENTRAL_USERNAME }}</username><password>${{ secrets.CENTRAL_TOKEN }}</password></server></servers><profiles><profile><id>central</id><activation><activeByDefault>true</activeByDefault></activation><properties><gpg.executable>gpg</gpg.executable></properties></profile></profiles></settings>" > /home/runner/.m2/settings.xml
          cat /home/runner/.m2/settings.xml


      - name: Code Checkout
        run: |
          git init
          git config --global user.name "apitomy-ci"
          git config --global user.email "apitomy.ci@gmail.com"
          git remote add origin "https://apitomy-ci:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch
          git checkout ${{ inputs.branch }}
          echo "#### Listing files after checkout ####"
          find .


      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}


      - name: Build
        run: mvn clean install -Ptranspilation -DskipTests
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8 --add-opens=java.base/java.net=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"


      - name: Maven Deploy
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 120
          command: mvn deploy -Prelease --batch-mode --settings /home/runner/.m2/settings.xml -DskipTests

      # Slack, when run on its own: success to the general channel, failure to the
      # important one. release.yaml reports the publishes it calls itself.
      - name: Notify
        if: ${{ !cancelled() && !inputs.quiet }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':package: {0}: {1} published {2}', github.repository, github.workflow, inputs.release-version) || format(':x: {0}: {1} failed for {2}', github.repository, github.workflow, inputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
