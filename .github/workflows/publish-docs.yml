name: Publish Documentation

# Publishes this branch's documentation into its own directory of the website, so that the release
# lines (main: 4.x, 3.1.x: 3.x) can be published side by side. The docs root, its redirect and the
# versions.json the version selector reads are maintained in the website repository.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
  workflow_dispatch:

env:
  # The website directory this branch publishes to; must match site_url in mkdocs.yml.
  DOCS_VERSION: 4.x

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'

    steps:
      - name: Checkout apitomy-data-models
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'

      # Shared with verify.yaml's docs-verify job, so the build that gated the pull request is
      # the same one that publishes here.
      - name: Install MkDocs and dependencies
        run: pip install -r docs-requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Checkout website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Apitomy/apitomy.github.io
          token: ${{ secrets.ACCESS_TOKEN }}
          path: website

      - name: Copy generated docs to website
        run: |
          rm -rf website/projects/data-models/docs/${DOCS_VERSION}
          mkdir -p website/projects/data-models/docs
          cp -r site website/projects/data-models/docs/${DOCS_VERSION}

      - name: Commit and push to website
        run: |
          cd website
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git add projects/data-models/docs/${DOCS_VERSION}
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Data Models ${DOCS_VERSION} documentation (automated)"
            # Other projects publish to the same repository; rebase over their pushes and retry.
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep $((attempt * 10))
            done
            exit 1
          fi
