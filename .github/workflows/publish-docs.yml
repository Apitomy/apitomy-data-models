name: Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
  workflow_dispatch:

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'

    steps:
      - name: Checkout apitomy-data-models
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'

      # Shared with verify.yaml's docs-verify job, so the build that gated the pull request is
      # the same one that publishes here.
      - name: Install MkDocs and dependencies
        run: pip install -r docs-requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Checkout website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Apitomy/apitomy.github.io
          token: ${{ secrets.ACCESS_TOKEN }}
          path: website

      - name: Copy generated docs to website
        run: |
          rm -rf website/projects/data-models/docs
          mkdir -p website/projects/data-models
          cp -r site website/projects/data-models/docs

      - name: Commit and push to website
        run: |
          cd website
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git add projects/data-models/docs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Data Models documentation (automated)"
            git push
          fi
