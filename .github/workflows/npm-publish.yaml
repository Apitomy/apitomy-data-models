name: NPM Publish Workflow
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 2.3.0)'
        required: true
      branch:
        description: 'Branch/tag to publish from'
        required: true
        default: 'main'
      prerelease:
        description: 'Publish under the "beta" dist-tag instead of deciding between "latest" and "latest-<major>"'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-version:
        description: 'Release version to publish'
        required: true
        type: string
      branch:
        description: 'Branch/tag to publish from'
        required: true
        type: string
      prerelease:
        description: 'Publish under the "beta" dist-tag instead of deciding between "latest" and "latest-<major>"'
        required: false
        type: boolean
        default: false
      quiet:
        description: 'Leave the Slack notification to the caller'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    steps:

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          registry-url: 'https://registry.npmjs.org'


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Data Models version ${{ inputs.release-version }} to NPM"
          echo "Publishing from branch/tag: ${{ inputs.branch }}"


      - name: Code Checkout
        run: |
          git init
          git config --global user.name "apitomy-ci"
          git config --global user.email "apitomy.ci@gmail.com"
          git remote add origin "https://apitomy-ci:${{ secrets.ACCESS_TOKEN }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch
          git checkout ${{ inputs.branch }}
          echo "#### Listing files after checkout ####"
          find .


      # A pre-release goes under "beta". A final release takes "latest" only when it is newer than
      # the version "latest" points to now, so a patch to an older major line cannot take it from
      # the current one; it goes under "latest-<major>" instead. See is-latest-release.sh.
      - name: Decide the NPM dist-tag
        env:
          NODE_AUTH_TOKEN: ''
          RELEASE_VERSION: ${{ inputs.release-version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            NPM_DIST_TAG=beta
          else
            # E404 means the package was never published; any other failure is fatal, so an
            # unreadable "latest" is never taken for "none".
            if CURRENT_LATEST=$(npm view @apitomy/data-models dist-tags.latest 2>"$RUNNER_TEMP/npm-view.err"); then
              :
            elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              CURRENT_LATEST=""
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit 1
            fi
            IS_LATEST=$(./.github/scripts/is-latest-release.sh "$RELEASE_VERSION" false "$CURRENT_LATEST")
            if [[ "$IS_LATEST" == "true" ]]; then
              NPM_DIST_TAG=latest
            else
              NPM_DIST_TAG="latest-${RELEASE_VERSION%%.*}"
            fi
            echo "npm \"latest\" is '${CURRENT_LATEST:-none}'"
          fi
          echo "NPM dist-tag: $NPM_DIST_TAG"
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> "$GITHUB_ENV"


      - name: Build TypeScript Package
        run: mvn clean install -Ptranspilation -DskipTests
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8 --add-opens=java.base/java.net=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"


      # NPM_DIST_TAG comes from the "Decide the NPM dist-tag" step, so that
      # `npm i @apitomy/data-models`, which resolves "latest", returns the newest final release.
      - name: Publish to NPM
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG" ./data-models/target/ts/
        env:
          NODE_AUTH_TOKEN: ''

      # Slack, when run on its own: success to the general channel, failure to the
      # important one. release.yaml reports the publishes it calls itself.
      - name: Notify
        if: ${{ !cancelled() && !inputs.quiet }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':package: {0}: {1} published {2}', github.repository, github.workflow, inputs.release-version) || format(':x: {0}: {1} failed for {2}', github.repository, github.workflow, inputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
